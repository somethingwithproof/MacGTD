version: 2
updates:
  - package-ecosystem: "github-actions"
    cooldown:
      default-days: 7
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "pip"
    cooldown:
      default-days: 7
    directory: "/tests/fuzz"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    # atheris 3.1.0 publishes only Linux wheels, so the macOS line stays on
    # 3.0.0, the last release with a source distribution. An ignore cannot be
    # limited to one platform marker; bump the Linux line by hand.
    ignore:
      - dependency-name: "atheris"
    commit-message:
      prefix: "build(deps)"
    groups:
      pip-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "terraform"
    cooldown:
      default-days: 7
    directory: "/infra/terraform"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "build(deps)"
    groups:
      terraform-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
