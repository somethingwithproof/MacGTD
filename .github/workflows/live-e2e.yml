name: Live provider E2E

on:
  workflow_dispatch:
    inputs:
      dedicated_test_accounts:
        description: Confirm these credentials and targets belong to dedicated test accounts
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: live-provider-e2e
  cancel-in-progress: false

jobs:
  live:
    name: Live API readback (all four providers)
    runs-on: macos-15-intel
    environment: provider-e2e
    timeout-minutes: 20
    env:
      MACGTD_E2E_DEDICATED: '1'
      MACGTD_LIVE_TEST_ACCOUNTS: ${{ inputs.dedicated_test_accounts && '1' || '0' }}
      MACGTD_TODOIST_TOKEN: ${{ secrets.MACGTD_TODOIST_TOKEN }}
      MACGTD_TODOIST_PROJECT_ID: ${{ secrets.MACGTD_TODOIST_PROJECT_ID }}
      MACGTD_NOTION_TOKEN: ${{ secrets.MACGTD_NOTION_TOKEN }}
      MACGTD_NOTION_DATA_SOURCE_ID: ${{ secrets.MACGTD_NOTION_DATA_SOURCE_ID }}
      MACGTD_MICROSOFT_TOKEN: ${{ secrets.MACGTD_MICROSOFT_TOKEN }}
      MACGTD_MICROSOFT_LIST_ID: ${{ secrets.MACGTD_MICROSOFT_LIST_ID }}
      MACGTD_GOOGLE_TOKEN: ${{ secrets.MACGTD_GOOGLE_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned test runtime
        run: |
          brew install mise
          mise install
      - name: Require every dedicated provider account before mutation
        run: mise exec -- python scripts/check-live-config.py
      - name: Provision the ephemeral macOS test desktop
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: mise exec -- python scripts/prepare-hosted-macos.py
      - name: Capture through real dialogs, read back vendor records, and clean up
        run: mise exec -- python tests/run.py live
      - name: Upload live test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: live-provider-e2e-${{ github.run_id }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 14
