name: Release packages

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  build:
    name: Build release packages
    needs: verify
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify tagged source is on main
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Expected a stable semantic version tag' >&2; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Package current source and compiled library
        run: ./scripts/package-release.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-packages
          path: |
            dist/MacGTD.zip
            dist/MacGTD.alfredworkflow
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  attest:
    name: Attest release packages
    needs: build
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-packages
          path: dist
      - name: Check artifact digests
        working-directory: dist
        run: sha256sum -c SHA256SUMS
      - name: Attest the built bytes
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/MacGTD.zip
            dist/MacGTD.alfredworkflow
      - name: Include verifiable Sigstore bundles
        env:
          BUNDLE_PATH: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          cp "$BUNDLE_PATH" dist/MacGTD.zip.sigstore.json
          cp "$BUNDLE_PATH" dist/MacGTD.alfredworkflow.sigstore.json
      - name: Verify attached bundles, source, and signer workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation verify dist/MacGTD.zip --bundle dist/MacGTD.zip.sigstore.json --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" --source-digest "$GITHUB_SHA" --source-ref "$GITHUB_REF" --deny-self-hosted-runners
          gh attestation verify dist/MacGTD.alfredworkflow --bundle dist/MacGTD.alfredworkflow.sigstore.json --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" --source-digest "$GITHUB_SHA" --source-ref "$GITHUB_REF" --deny-self-hosted-runners
      - name: Export the verified signed in-toto envelope
        env:
          BUNDLE_PATH: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          jq -ce '
            .dsseEnvelope
            | select(.payloadType == "application/vnd.in-toto+json")
            | select((.payload | type) == "string" and (.payload | length) > 0)
            | select((.signatures | type) == "array" and (.signatures | length) > 0)
            | select(all(.signatures[]; (.sig | type) == "string" and (.sig | length) > 0))
            | select((.payload | @base64d | fromjson | ._type) == "https://in-toto.io/Statement/v1")
            | select((.payload | @base64d | fromjson | .predicateType) == "https://slsa.dev/provenance/v1")
          ' "$BUNDLE_PATH" > dist/MacGTD.intoto.jsonl
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-release-packages
          path: dist/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Create draft GitHub release
    needs: attest
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      attestations: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-release-packages
          path: dist
      - name: Create a draft from verified packages
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd dist
          sha256sum -c SHA256SUMS
          gh attestation verify MacGTD.zip --bundle MacGTD.zip.sigstore.json --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" --source-digest "$GITHUB_SHA" --source-ref "$GITHUB_REF" --deny-self-hosted-runners
          gh attestation verify MacGTD.alfredworkflow --bundle MacGTD.alfredworkflow.sigstore.json --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" --source-digest "$GITHUB_SHA" --source-ref "$GITHUB_REF" --deny-self-hosted-runners
          jq -ce '.dsseEnvelope' MacGTD.zip.sigstore.json | cmp - MacGTD.intoto.jsonl
          gh release create "$RELEASE_TAG" MacGTD.zip MacGTD.alfredworkflow SHA256SUMS MacGTD.zip.sigstore.json MacGTD.alfredworkflow.sigstore.json MacGTD.intoto.jsonl --repo "$GITHUB_REPOSITORY" --verify-tag --draft --generate-notes
