name: E2E Tests

on:
  workflow_call:
    inputs:
      test_suite:
        type: string
        default: automator
  workflow_dispatch:
    inputs:
      test_suite:
        description: Test suite to run
        required: true
        default: automator
        type: choice
        options: [automator]
      test_filter:
        description: Optional test ID substring for diagnosis (blank runs all native tests)
        type: string
        default: ''
  schedule:
    - cron: '23 10 * * *'

permissions:
  contents: read

jobs:
  e2e-tests:
    name: E2E (${{ inputs.test_suite || 'automator' }})
    runs-on: macos-15-intel
    timeout-minutes: 30
    env:
      MACGTD_E2E_DEDICATED: '1'
      TEST_SUITE: ${{ inputs.test_suite || 'automator' }}
      TEST_FILTER: ${{ inputs.test_filter || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned test runtime
        run: |
          brew install mise
          mise install
      - name: Provision the ephemeral macOS test desktop
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: mise exec -- python scripts/prepare-hosted-macos.py
      - name: Run selected end-to-end suite
        run: mise exec -- python tests/run.py "$TEST_SUITE" --filter "$TEST_FILTER"
      - name: Upload E2E reports, logs, and tested package
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/
            dist/MacGTD.alfredworkflow
          if-no-files-found: error
          retention-days: 14
