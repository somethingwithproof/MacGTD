name: E2E Tests

on:
  workflow_call:
    inputs:
      test_suite:
        type: string
        default: automator
  workflow_dispatch:
    inputs:
      test_suite:
        description: Test suite to run
        required: true
        default: automator
        type: choice
        options: [automator]
  schedule:
    - cron: '23 10 * * *'

permissions:
  contents: read

jobs:
  e2e-tests:
    name: E2E (${{ inputs.test_suite || 'automator' }})
    runs-on: macos-15-intel
    timeout-minutes: 30
    concurrency:
      group: macgtd-desktop-e2e
      cancel-in-progress: false
    env:
      MACGTD_E2E_DEDICATED: '1'
      TEST_SUITE: ${{ inputs.test_suite || 'automator' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install pinned test runtime
        run: |
          brew install mise
          mise install
      - name: Provision the ephemeral macOS test desktop
        run: mise exec -- python scripts/prepare-hosted-macos.py
      - name: Run selected end-to-end suite
        run: mise exec -- python tests/run.py "$TEST_SUITE"
      - name: Upload E2E reports, logs, and tested package
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/
            dist/MacGTD.alfredworkflow
          if-no-files-found: error
          retention-days: 14
