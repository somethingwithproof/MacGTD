name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install validation tools and pinned runtime
        run: |
          brew install actionlint shellcheck mise
          mise install
      - name: Lint GitHub Actions and every shell script
        run: |
          actionlint
          find scripts tests workflows infra -name '*.sh' -print0 | xargs -0 shellcheck
      - name: Validate, test production parser, and verify packaged workflow
        run: mise exec -- python tests/run.py validation
      - name: Build and verify both release packages
        run: ./scripts/package-release.sh
      - name: Upload validation reports and package
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: validation-${{ matrix.os }}
          path: |
            test-results/
            dist/MacGTD.alfredworkflow
            dist/GTDLib.scptd/
            dist/MacGTD.zip
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  e2e:
    name: Native macOS E2E
    needs: validate
    uses: ./.github/workflows/e2e.yml
    with:
      test_suite: automator
