name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install validation tools and pinned runtime
        run: |
          brew install actionlint shellcheck mise
          mise install
      - name: Lint GitHub Actions and every shell script
        run: |
          actionlint
          find scripts tests workflows infra -name '*.sh' -print0 | xargs -0 shellcheck
      - name: Validate, test production parser, and verify packaged workflow
        run: mise exec -- python tests/run.py validation
      - name: Upload validation reports and package
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: validation-${{ matrix.os }}
          path: |
            test-results/
            dist/MacGTD.alfredworkflow
          if-no-files-found: error
          retention-days: 14

  e2e:
    name: Native and Alfred E2E
    needs: validate
    uses: ./.github/workflows/e2e.yml
    with:
      test_suite: automator
